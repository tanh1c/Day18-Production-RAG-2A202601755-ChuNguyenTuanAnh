[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness/import hygiene. Broad exception handling is
# intentional at external model/API boundaries because the lab requires fallbacks.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
