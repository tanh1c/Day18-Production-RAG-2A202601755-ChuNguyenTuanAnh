[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on syntax/runtime/import correctness. The starter modules use
# a deliberate sys.path bootstrap before project imports, so E4 positioning rules
# are not a useful grading signal here.
select = ["E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
