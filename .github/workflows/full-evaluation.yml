name: Full RAG Evaluation

on:
  workflow_dispatch:

concurrency:
  group: full-rag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: ~/.cache/huggingface
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  evaluate:
    name: End-to-end RAGAS and 110-point gate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      qdrant:
        image: qdrant/qdrant:v1.9.7
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-full-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-full-${{ runner.os }}-py311-
            hf-${{ runner.os }}-py311-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.3

      - name: Verify required secret is available
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "OPENAI_API_KEY repository secret is required for full RAGAS evaluation."
            exit 1
          }
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN is configured."
          else
            echo "HF_TOKEN is not configured; public model download will be attempted anonymously."
          fi

      - name: Wait for Qdrant
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null; then
              echo "Qdrant is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant failed to become ready."
          exit 1

      - name: Pre-download embedding and reranker models
        run: |
          python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          SentenceTransformer("all-MiniLM-L6-v2")
          SentenceTransformer("BAAI/bge-m3")
          CrossEncoder("BAAI/bge-reranker-v2-m3")
          print("Hugging Face models cached.")
          PY

      - name: Public tests before paid evaluation
        run: pytest tests/ -q --tb=short

      - name: Static rubric checks
        shell: bash
        run: |
          ruff check --select E4,E7,E9,F,I --ignore E402 src/ check_lab.py main.py naive_baseline.py scripts/check_rubric.py
          if grep -RIn --include='m*.py' '# TODO:' src/; then
            echo "Unresolved TODO marker found."
            exit 1
          fi

      - name: Run baseline and production pipeline
        run: python main.py

      - name: Prepare assignment-compatible reflection path
        shell: bash
        run: |
          cp analysis/reflections/reflection_ChuNguyenTuanAnh.md \
             analysis/reflection_ChuNguyenTuanAnh.md

      - name: Validate submission structure and tests
        run: python check_lab.py

      - name: Score rubric and require 110/110
        run: python scripts/check_rubric.py --strict

      - name: Persist evaluation deliverables to submission branch
        if: always() && github.ref_name == 'feat/lab18-submission'
        shell: bash
        run: |
          if [ ! -f reports/ragas_report.json ]; then
            echo "No evaluation report was generated; nothing to persist."
            exit 0
          fi
          cp reports/ragas_report.json ragas_report.json
          cp analysis/reflections/reflection_ChuNguyenTuanAnh.md \
             analysis/reflection_ChuNguyenTuanAnh.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ ragas_report.json analysis/failure_analysis.md \
                  analysis/reflection_ChuNguyenTuanAnh.md
          if git diff --cached --quiet; then
            echo "Evaluation deliverables are unchanged."
            exit 0
          fi
          git commit -m "chore: persist final Lab18 evaluation reports [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab18-evaluation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ragas_report.json
            reports/
            analysis/
