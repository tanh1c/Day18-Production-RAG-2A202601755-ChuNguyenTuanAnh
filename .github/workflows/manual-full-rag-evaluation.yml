name: Manual Full RAG Evaluation (110/110)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch to evaluate
        required: true
        default: feat/lab18-submission
        type: choice
        options:
          - feat/lab18-submission

concurrency:
  group: manual-full-rag-${{ inputs.target_ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: ~/.cache/huggingface
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TARGET_REF: ${{ inputs.target_ref }}

jobs:
  evaluate:
    name: End-to-end RAGAS and strict 110-point gate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      qdrant:
        image: qdrant/qdrant:v1.9.7
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-final-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-final-${{ runner.os }}-py311-
            hf-full-${{ runner.os }}-py311-
            hf-${{ runner.os }}-py311-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.3

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "OPENAI_API_KEY repository secret is required."
            exit 1
          }
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN is configured."
          else
            echo "HF_TOKEN is not configured; public model download will be attempted anonymously."
          fi

      - name: Wait for Qdrant
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null; then
              echo "Qdrant is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant failed to become ready."
          exit 1

      - name: Pre-download models
        run: |
          python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          SentenceTransformer("all-MiniLM-L6-v2")
          SentenceTransformer("BAAI/bge-m3")
          CrossEncoder("BAAI/bge-reranker-v2-m3")
          print("Hugging Face models cached.")
          PY

      - name: Public tests
        run: pytest tests/ -q --tb=short

      - name: Static checks
        shell: bash
        run: |
          ruff check --select E4,E7,E9,F,I --ignore E402 src/ check_lab.py main.py naive_baseline.py scripts/check_rubric.py
          if grep -RIn --include='m*.py' '# TODO:' src/; then
            echo "Unresolved TODO marker found."
            exit 1
          fi

      - name: Run baseline and production pipeline
        run: python main.py

      - name: Prepare assignment-compatible reflection
        shell: bash
        run: |
          cp analysis/reflections/reflection_ChuNguyenTuanAnh.md \
             analysis/reflection_ChuNguyenTuanAnh.md

      - name: Validate submission
        run: python check_lab.py

      - name: Require strict 110/110
        run: python scripts/check_rubric.py --strict

      - name: Persist final evaluation deliverables
        if: always()
        shell: bash
        run: |
          if [ ! -f reports/ragas_report.json ]; then
            echo "No RAGAS report was generated; nothing to persist."
            exit 0
          fi

          cp reports/ragas_report.json ragas_report.json
          cp analysis/reflections/reflection_ChuNguyenTuanAnh.md \
             analysis/reflection_ChuNguyenTuanAnh.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            reports/ragas_report.json \
            reports/naive_baseline_report.json \
            reports/latency_report.json \
            reports/latency_report.md \
            reports/rubric_summary.md \
            ragas_report.json \
            analysis/failure_analysis.md \
            analysis/reflection_ChuNguyenTuanAnh.md

          if git diff --cached --quiet; then
            echo "Evaluation deliverables are unchanged."
            exit 0
          fi

          git commit -m "chore: persist final Lab18 evaluation reports [skip ci]"
          git push origin "HEAD:${TARGET_REF}"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab18-final-evaluation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/
            ragas_report.json
            analysis/failure_analysis.md
            analysis/reflection_ChuNguyenTuanAnh.md
